[package]
name = "gateway-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aletheon typed Gateway client"

# CGP-02 owner-seam crate: typed request/response/event envelope, request
# correlation, snapshot+cursor subscription.  Uses gateway-protocol for the
# contract; owns framing/correlation/reconnect.  ACP outer framing stays in
# interact::acp.  No traffic cut.
[dependencies]
gateway-protocol = { path = "../gateway-protocol" }
fabric = { path = "../fabric" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[lints]
workspace = true
