name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Formatting
        run: bash scripts/cargo-agent.sh +1.88.0 fmt --all -- --check
      - name: Assembly package tests
        run: bash scripts/cargo-agent.sh +1.88.0 test -p aletheon --locked
      - name: Release metadata tests
        run: python3 -m unittest scripts/tests/test_release_metadata.py

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build binaries
        run: |
          bash scripts/cargo-agent.sh +stable build --release --locked \
            --target ${{ matrix.target }} \
            -p aletheon

      - name: Package
        id: package
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCH="${{ matrix.target }}"
          STAGING="aletheon-${TAG}-${ARCH}"
          mkdir "${STAGING}"

          cp "target/${ARCH}/release/aletheon" "${STAGING}/"
          cp LICENSE README.md "${STAGING}/" 2>/dev/null || true

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            python3 scripts/release_metadata.py \
              --binary "${STAGING}/aletheon" \
              --target "${ARCH}" \
              --output "${STAGING}.spdx.json"
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "archive=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "metadata=${STAGING}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.metadata }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify release artifacts and generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          archives=(aletheon-*.tar.gz)
          metadata=(aletheon-*.spdx.json)
          [[ ${#archives[@]} -eq 2 ]] || {
            echo "expected two release archives, found ${#archives[@]}" >&2
            exit 1
          }
          [[ ${#metadata[@]} -eq 2 ]] || {
            echo "expected two SPDX metadata files, found ${#metadata[@]}" >&2
            exit 1
          }
          sha256sum "${archives[@]}" "${metadata[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            CHANGES=$(git log --oneline --no-decorate)
          else
            CHANGES=$(git log --oneline --no-decorate "${PREV_TAG}..${TAG}")
          fi

          # Write to file to avoid shell escaping issues
          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > changelog.md

      - name: Check prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qiE '(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: changelog.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            *.tar.gz
            *.spdx.json
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
