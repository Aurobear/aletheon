name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  ALETHEON_CARGO_CACHE_ROOT: /home/aletheon-ci/.cache/aletheon-cargo
  ALETHEON_CARGO_TARGET_MAX_GIB: 30

# Runner jobs are deliberately limited to branches in this repository. The
# repository is public, so forked pull requests must never execute arbitrary
# code on the persistent SER8 host.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: architecture fitness
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch architecture comparison base
        shell: bash
        run: |
          base="${{ github.base_ref || 'dev' }}"
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags --depth=1 origin \
              "+refs/heads/$base:refs/remotes/origin/$base"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Verify preinstalled stable toolchain
        run: rustup run stable rustc --version
      - run: bash scripts/aletheon.sh test architecture
      - name: Verify documentation paths
        run: python3 scripts/check-doc-paths.py
      - name: Reject architecture drift
        env:
          ARCH_BASE_REF: origin/${{ github.base_ref || 'dev' }}
        run: bash scripts/aletheon.sh acceptance architecture

  pr-validation:
    name: PR validation
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled stable toolchain
        run: rustup run stable rustc --version
      - name: Formatting
        run: bash scripts/cargo-agent.sh fmt --all -- --check
      - name: Test workspace
        run: bash scripts/cargo-agent.sh +stable test --workspace
      - name: Test aletheon integration (test-support)
        run: bash scripts/cargo-agent.sh +stable test -p aletheon --tests --features test-support

  feature-contracts:
    name: Feature contracts
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check io_uring contract
        run: bash scripts/cargo-agent.sh +stable check -p contracts --all-targets --features io_uring
      - name: Check Linux integration contracts
        run: bash scripts/cargo-agent.sh +stable check -p corpus --all-targets --features dbus,input,display,a11y,ocr,sandbox-primitives
      - name: Check memory feature contracts
        run: bash scripts/cargo-agent.sh +stable check -p mnemosyne --all-targets --all-features

  monitor-contracts:
    name: Monitor and Nightwatch contracts
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated monitor environment
        run: python3 -m venv "$RUNNER_TEMP/aletheon-monitor-venv"
      - name: Install monitor test dependencies
        run: |
          "$RUNNER_TEMP/aletheon-monitor-venv/bin/python" -m pip install \
            --disable-pip-version-check -e 'tools/aletheon-monitor[dev]'
      - name: Run monitor and Nightwatch contracts
        run: |
          "$RUNNER_TEMP/aletheon-monitor-venv/bin/python" -m pytest -q \
            tools/aletheon-monitor/tests

  strict-contracts:
    name: Strict contracts
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled stable toolchain
        run: rustup run stable rustc --version
      - name: Verify replay receipts
        run: python3 tests/coding/replay_test.py
      - name: Verify coding harness contracts
        run: bash tests/coding/static_test.sh
      - name: Verify production coding closure
        run: bash scripts/cargo-agent.sh +stable test -p aletheon --test coding_production_e2e --features test-support
      - name: Verify Linux platform contracts
        run: bash scripts/cargo-agent.sh +stable test -p platform --test contract_suite
      - name: Verify JSON-RPC snapshots
        run: bash scripts/cargo-agent.sh +stable test -p interact --test json_rpc_snapshots

  strict-quality:
    name: Strict quality
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled stable toolchain
        run: rustup run stable rustc --version
      - name: Formatting
        run: bash scripts/cargo-agent.sh fmt --all -- --check
      - name: Clippy
        run: bash scripts/cargo-agent.sh +stable clippy --workspace -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: bash scripts/cargo-agent.sh +stable doc --workspace --no-deps
      - name: Release build
        run: bash scripts/cargo-agent.sh +stable build --workspace --release

  strict-msrv:
    name: Rust 1.88 MSRV
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Verify preinstalled MSRV toolchain
        run: rustup run 1.88.0 rustc --version
      - run: bash scripts/cargo-agent.sh +1.88.0 check --workspace --all-targets

  strict-pi-contract:
    name: Pinned Pi RPC contract
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, aletheon]
    timeout-minutes: 20
    env:
      ALETHEON_REAL_PI: pi
      ALETHEON_REAL_PI_VERSION: 0.80.10
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled stable toolchain
        run: rustup run stable rustc --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install reviewed Pi release without lifecycle scripts
        run: |
          npm install --prefix "$RUNNER_TEMP/pi" --ignore-scripts \
            @earendil-works/pi-coding-agent@${ALETHEON_REAL_PI_VERSION}
          echo "$RUNNER_TEMP/pi/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify real Pi RPC framing and state response
        run: bash scripts/cargo-agent.sh +stable test -p aletheon --test pi_real_contract -- --ignored --exact pinned_pi_rpc_get_state_obeys_reviewed_jsonl_contract
