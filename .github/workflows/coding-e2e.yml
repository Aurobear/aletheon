name: Installed Coding Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Installed DeepSeek coding fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALETHEON_PROVIDER: lejurobot_deepseek
      ALETHEON_MODEL: deepseek/deepseek-v4-flash[1m]
      ALETHEON_CODING_SANDBOX: forbid
      LEJU_API_KEY: ${{ secrets.LEJU_API_KEY }}
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ALETHEON_BIN: /usr/bin/aletheon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev ripgrep bubblewrap python3-venv

      - name: Configure and deploy the system runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LEJU_API_KEY:-}" ]]; then
            echo "LEJU_API_KEY repository secret is required" >&2
            exit 2
          fi

          install -d -m 0700 "$HOME/.aletheon"
          config="$HOME/.aletheon/config.toml"
          CONFIG_PATH="$config" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["CONFIG_PATH"])
          content = f'''[agent]
          default_provider = {json.dumps(os.environ["ALETHEON_PROVIDER"])}
          default_model = {json.dumps(os.environ["ALETHEON_MODEL"])}

          [[providers]]
          name = {json.dumps(os.environ["ALETHEON_PROVIDER"])}
          base_url = "https://aiapi.lejurobot.com"
          api_key = ""
          transport = "openai"
          models = [{json.dumps(os.environ["ALETHEON_MODEL"])}]
          '''
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w") as output:
              output.write(content)
          PY

          getent group aletheon >/dev/null || sudo groupadd --system aletheon
          id -u aletheon >/dev/null 2>&1 || sudo useradd --system --gid aletheon \
            --home-dir /var/lib/aletheon --shell /usr/sbin/nologin aletheon
          sudo install -d -o root -g aletheon -m 0750 \
            /etc/aletheon /etc/aletheon/credentials
          credential=$(mktemp)
          chmod 0600 "$credential"
          printf 'LEJUROBOT_DEEPSEEK_API_KEY=%s\n' "$LEJU_API_KEY" > "$credential"
          sudo install -o aletheon -g aletheon -m 0600 "$credential" \
            /etc/aletheon/credentials/provider.env
          rm -f "$credential"

          # The deploy command is the only installed-runtime authority.  It
          # builds through cargo-agent.sh, installs that exact release binary,
          # restarts both daemon layers, and executes its runtime gate.
          sudo bash scripts/aletheon.sh deploy

      - name: Run the immutable installed acceptance suite
        shell: bash
        run: |
          set -uo pipefail
          artifacts="$RUNNER_TEMP/coding-artifacts"
          acceptance_root="$artifacts/acceptance"
          export ALETHEON_ACCEPTANCE_SOCKET="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/aletheon/aletheon.sock"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$artifacts" "$acceptance_root"

          installed_digest=$(sha256sum /usr/bin/aletheon | awk '{print $1}')
          generation_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${installed_digest:0:16}"
          run_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          python3 tests/coding/harness/suite.py \
            --catalog tests/coding/tasks \
            --receipts "$artifacts/receipts" \
            --report "$artifacts/suite.json" \
            --run-id "$run_id" \
            --generation-id "$generation_id" \
            --artifacts-root "$acceptance_root"
          suite_exit=$?

          if [[ ! -s "$artifacts/suite.json" ]]; then
            echo "infrastructure failure: suite produced no report" >&2
            exit 2
          fi
          python3 - "$artifacts/suite.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("## Installed coding acceptance\n\n")
              summary.write("| task | expected | observed | failure | passed |\n")
              summary.write("|---|---|---|---|---|\n")
              for task in report["tasks"]:
                  summary.write(
                      f"| {task['task_id']} | {task['expected_terminal']} | "
                      f"{task['observed_terminal']} | {task['failure_class']} | "
                      f"{task['outcome_passed']} |\n"
                  )
          PY

          if (( suite_exit == 2 )); then
            echo "One or more fixtures had an infrastructure failure" >&2
            exit 2
          fi
          if (( suite_exit == 1 )); then
            echo "One or more fixtures missed its authoritative benchmark outcome" >&2
            exit 1
          fi
          if (( suite_exit != 0 )); then
            echo "infrastructure failure: unexpected suite exit $suite_exit" >&2
            exit 2
          fi

      - name: Remove provider credential
        if: always()
        run: sudo rm -f /etc/aletheon/credentials/provider.env

      - name: Upload installed acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-coding-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/coding-artifacts
          if-no-files-found: warn
          retention-days: 14
