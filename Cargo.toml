[workspace]
resolver = "2"
members = [
    "crates/aletheon",
    "crates/fabric",
    "crates/cognit",
    "crates/corpus",
    "crates/dasein",
    "crates/interact",
    "crates/mnemosyne",
    "crates/agora",
    "crates/metacog",
    "crates/kernel",
    "crates/gateway",
    "crates/executive",
    "crates/execd",
    "crates/platform",
    "crates/runtime",
    "crates/hardware",
    "examples/basic_agent",
    "examples/evolution_loop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
bitflags = "2"
bincode = "1"
libc = "0.2"
toml = "0.8"
regex = "1"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
urlencoding = "2"
nix = { version = "0.29", features = ["user", "ioctl"] }
dashmap = "6"
tokio-util = "0.7"
walkdir = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"

[workspace.lints.rust]
# Placeholder features for future use (io_uring, ebpf, fuse, vector-*)
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("io_uring", "ebpf", "fuse", "vector-qdrant", "vector-lance"))',
] }

# This workspace has hundreds of integration-test binaries. Full DWARF embeds
# the dependency graph into every binary, which previously grew one all-feature
# test build beyond 120 GiB and forced the shared cache to rebuild from scratch.
# Test failures retain symbol names and backtraces; line-level debugging can be
# requested locally with `CARGO_PROFILE_TEST_DEBUG=1` when needed.
[profile.test]
debug = 0
incremental = true

# Keep development binaries useful for backtraces without paying the full-DWARF
# link and storage cost on every ordinary build.
[profile.dev]
debug = 1
incremental = true

# Local deployment is an edit/verify loop too. Preserve optimized codegen units
# between deployments instead of rebuilding the 120k-line executive crate after
# every source edit. The tagged release workflow explicitly overrides this with
# CARGO_INCREMENTAL=0 for distributable artifacts.
[profile.release]
incremental = true

# Benchmarks should measure runtime, not repeatedly pay cold optimized codegen.
[profile.bench]
incremental = true
