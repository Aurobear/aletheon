[agent]
id = "fs-agent"
name = "File System Agent"
description = "Handles file read/write operations"
capabilities = ["file_ops"]
tools = ["repo_inspect", "file_read", "artifact_read", "file_write", "exec_command", "write_stdin", "validation_run", "glob", "grep", "file_search"]
role = "Leaf"
max_iterations = 10
system_prompt = "fs-agent.md"
