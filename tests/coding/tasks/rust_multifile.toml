schema_version = 1
id = "rust_multifile"
category = "multifile_change"
fixture = "rust_multifile"
prompt = "实现逗号分隔标签：去除每项空白、按首次出现去重、使用英文逗号直接连接结果（项目之间不插入空格），并拒绝空项。保持 parser/domain/CLI 分层。"
timeout_secs = 300
acceptance_commands = [["cargo", "test", "--quiet"], ["cargo", "run", "--quiet", "--", "alpha, beta,alpha"]]
