schema_version = 1

[installed_runtime]
required = true
command = "sudo bash scripts/aletheon.sh deploy"
affected_path_prefixes = [
  "Cargo.toml",
  "Cargo.lock",
  "agents",
  "config",
  "crates/cognit",
  "crates/corpus",
  "crates/aletheon",
  "crates/application",
  "crates/runtime",
  "crates/adapters/sqlite",
  "crates/contracts",
  "crates/gateway",
  "scripts",
]

[changed_validation]
schema_version = 1

[[changed_validation.rust_test_groups]]
package = "cognit"
source_paths = [
  "crates/cognit/src/harness/linear/exploration.rs",
  "crates/cognit/src/harness/linear/mod.rs",
  "crates/cognit/src/harness/linear/tool_exec.rs",
]
lib_filters = ["harness::linear::"]

[[changed_validation.rust_test_groups]]
package = "corpus"
source_paths = [
  "crates/corpus/src/security/runner.rs",
  "crates/corpus/src/security/sandbox/bubblewrap.rs",
  "crates/corpus/src/security/sandbox/bwrap_builder.rs",
  "crates/corpus/src/tools/tools/agent_control.rs",
]
lib_filters = ["security::"]
integration_targets = ["agent_control_tools"]

[[changed_validation.rust_test_groups]]
package = "aletheon"
source_paths = [
  "crates/aletheon/src/wiring/adapters/channel/daemon_adapter.rs",
  "crates/aletheon/src/wiring/adapters/runtime/pi_rpc.rs",
  "crates/aletheon/src/wiring/adapters/session/event_sourced_store.rs",
  "crates/aletheon/src/wiring/application/admin_service.rs",
  "crates/aletheon/src/wiring/application/daemon_turn_engine.rs",
  "crates/aletheon/src/wiring/application/turn_coordinator.rs",
  "crates/aletheon/src/wiring/application/turn_pipeline.rs",
  "crates/aletheon/src/wiring/daemon/bootstrap/request.rs",
  "crates/aletheon/src/wiring/daemon/handler/rpc.rs",
  "crates/aletheon/src/wiring/daemon/session_projection.rs",
]
lib_filters = [
  "wiring::adapters::runtime::pi_rpc::tests::",
  "wiring::application::admin_service::",
  "wiring::application::turn_coordinator::",
  "wiring::application::turn_pipeline::",
  "wiring::daemon::bootstrap::request::tests::",
]
integration_targets = [
  "admin_service",
  "memory_forget_admin",
  "pi_rpc_runtime",
  "turn_coordinator_lifecycle",
]

[[changed_validation.rust_test_groups]]
package = "contracts"
source_paths = [
  "crates/contracts/src/contract/command.rs",
  "crates/contracts/src/ipc/stream.rs",
  "crates/contracts/src/protocol/client.rs",
  "crates/contracts/src/types/agent_control.rs",
  "crates/contracts/src/types/session.rs",
  "crates/contracts/src/types/tool.rs",
]
lib_filters = [
  "contract::command::tests::",
  "ipc::stream::tests::",
  "protocol::client::request_tests::",
  "types::agent_control::delegation_tests::",
  "types::session::tests::",
  "types::tool::tests::",
]
integration_targets = ["agent_control_contract", "session_contract"]

[[changed_validation.rust_test_groups]]
package = "interact"
source_paths = [
  "crates/interact/src/single_message.rs",
  "crates/interact/src/tui/agent_inspector.rs",
  "crates/interact/src/tui/app/lifecycle.rs",
  "crates/interact/src/tui/app/key_handler.rs",
  "crates/interact/src/tui/app/submit.rs",
  "crates/interact/src/tui/command.rs",
  "crates/interact/src/tui/help_overlay.rs",
  "crates/interact/src/tui/mod.rs",
  "crates/interact/src/tui/reducer.rs",
  "crates/interact/src/tui/registry.rs",
  "crates/interact/src/tui/render/draw.rs",
  "crates/interact/src/tui/render/renderable.rs",
  "crates/interact/src/tui/response.rs",
  "crates/interact/src/tui/status.rs",
  "crates/interact/src/tui/task_console.rs",
]
lib_filters = ["tui::"]
integration_targets = ["tui_reducer"]
