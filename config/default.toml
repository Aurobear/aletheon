[agent]
# Compiled defaults — override in /etc/aletheon, ~/.aletheon, or project config.
# default_provider and default_model match the first configured provider below.
default_provider = "lejurobot_deepseek"
default_model = "deepseek/deepseek-v4-flash[1m]"
# Bound cumulative provider/tool rounds for every top-level turn. Set 0 only in
# an explicitly reviewed override when another authoritative budget is present.
max_iterations = 50
# Bound one provider response. The previous implicit 100k ceiling let a
# misrouted or reasoning-heavy simple turn consume an excessive hidden/output
# budget; complex work should use additional bounded rounds instead.
max_tokens = 16384

[agent.provider_timeouts]
# Bound connection setup, whole non-stream responses / stream headers, and SSE silence.
connect_timeout_ms = 10000
request_timeout_ms = 90000
stream_idle_timeout_ms = 90000

[backpressure]
max_concurrent_turns = 8
max_connections = 64
max_event_spine_bytes = 1073741824

[agent.admission]
max_agents_per_root = 64
max_running_agents = 16
max_depth = 4
max_queued_per_root = 32
sibling_fairness_quantum = 1
root_max_tokens = 2000000
max_child_tokens = 200000
max_storage_bytes = 4294967296
max_storage_items = 128

# Default agent profile for new sessions. `general-agent` is a capable
# general-purpose worker (see agents/general-agent.md); safety is enforced by
# each tool's permission level (L0-L3) and the sandbox, not by a narrow
# allowed-tools whitelist. Switch to a scoped profile (safe-agent,
# orchestrator-agent, ...) for restricted contexts.
[agent_profiles]
default = "general-agent"

# At least one provider is required for the daemon to start.
# Fill in api_key (or set it via your local override config), then run the daemon.
[[providers]]
name = "lejurobot_deepseek"
base_url = "https://aiapi.lejurobot.com"
api_key = ""
transport = "openai"
models = ["deepseek/deepseek-v4-flash[1m]"]

[providers.backpressure]
# This account is governed by a rolling request-rate limit. Coordinate request
# starts in the machine core so sessions, role children, and embedding work do
# not independently burst the same endpoint/model.
min_request_interval_ms = 15000

[providers.cache]
# How this provider's usage telemetry cache figures are interpreted. `auto`
# inspects the wire fields themselves and never fabricates a hit/miss. Values:
# auto | deepseek_chat | openai_cached_tokens | unsupported. This only explains
# telemetry; it does not turn server-side caching on or off.
reporting = "auto"
# Whether the endpoint supports provider-side prefix caching. `auto` leaves the
# decision to runtime facts/benchmarks rather than model-name guessing.
prefix_cache = "auto"

# Official DeepSeek endpoint. Its unprefixed model IDs are distinct from the
# LejuRobot proxy namespace above. Set DEEPSEEK_API_KEY to select this provider.
[[providers]]
name = "deepseek"
base_url = "https://api.deepseek.com"
api_key = ""
transport = "openai"
models = ["deepseek-v4-flash[1m]"]

[providers.cache]
reporting = "auto"
prefix_cache = "auto"

# Optional local/offline fallback provider.
# The LLM scheduler fails over to the next configured provider when the primary
# is unavailable/terminal AND (since the context-overflow hardening) when a
# prompt overflows the primary's context window. Adding a local Ollama provider
# here gives the daemon an offline safety net for both cases.
# To activate: install Ollama (https://ollama.com), pull a model
# (e.g. `ollama pull qwen2.5-coder`), then uncomment:
# [[providers]]
# name = "ollama"
# base_url = "http://localhost:11434/v1"
# api_key = "ollama"           # placeholder — Ollama ignores it
# transport = "openai"
# models = ["qwen2.5-coder"]
# Unknown/private models must declare max_context_length explicitly; common
# models resolve it from crates/cognit/resources/model_catalog.json.
# max_context_length = 32768

[sandbox]
preference = "require"
# bubblewrap_path = "/usr/bin/bwrap"

[plugins]
directories = []

# Host-owned coding evaluation is explicitly enabled for the shipped runtime.
# The Rust schema default remains disabled so legacy configs that omit this
# section preserve their historical behavior.
[evaluation]
enabled = true
default_mode = "enforce"
coding_rubric = "coding-v2"
min_score_millis = 70000
min_evidence_coverage_millis = 600
min_confidence_millis = 700
max_evaluation_ms = 5000

[memory]
backend = "sqlite"
data_dir = "~/.aletheon/memory"

[memory.policy]
version = "memory-policy-v1"
semantic_profile = "safe-agent"
evidence_provenance_weight = 25
future_utility_weight = 20
stability_weight = 15
novelty_dedup_weight = 15
scope_fit_weight = 10
verification_weight = 15
privacy_risk_max_penalty = 25
contradiction_risk_max_penalty = 20
candidate_threshold = 55
promote_local_threshold = 75
remote_projection_threshold = 80
lease_duration_ms = 30000
max_items_per_run = 20
run_deadline_ms = 120000
semantic_retry_delay_ms = 900000
max_provider_rounds = 1
max_provider_retries = 1
max_tool_calls = 0
max_input_bytes = 65536
max_output_bytes = 16384
max_projected_writes = 10
remote_allowed_kinds = ["goal_outcome", "semantic_fact", "procedure", "architecture_decision"]

# Optional supplemental memory. Fail-open: a missing or unreachable gbrain
# MCP server degrades gracefully (empty pre-turn recall, logged at WARN).
# Authentication and transport are configured in the matching [[mcp_servers]]
# entry. See deploy/gbrain/README.md for setup instructions.
[memory.gbrain]
enabled = true
server_name = "gbrain"
read_sources = ["aletheon", "general"]
write_source = "aletheon"
request_timeout_ms = 1200
delivery_batch_size = 20
recall_limit = 4
max_content_bytes = 6000
projection_enabled = false
spool_path = "~/.aletheon/memory/memory-spool.db"
spool_max_items = 10000
spool_max_bytes = 268435456
retry_initial_ms = 1000
retry_max_ms = 60000
retry_max_attempts = 12
retry_max_age_secs = 86400
schema_fixture = ""
schema_version = "v0.42.59.0"
legacy_outbox_dir = "~/.aletheon/memory-outbox"
# ── gbrain MCP transport ─────────────────────────────────────────────────
# Uncomment and fill in your gbrain endpoint + auth to activate semantic
# recall.  The bearer_token_env value must name an env var that holds a
# valid gbrain API token (export GBRAIN_TOKEN=<token> before starting the
# daemon).  If gbrain is unreachable, pre-turn recall degrades silently.
#
# [[mcp_servers]]
# name = "gbrain"
# transport = "http"
# url = "http://127.0.0.1:9020/mcp"
# trust = "RemoteTrusted"
# bearer_token_env = "GBRAIN_TOKEN"

# Synchronous pre-turn memory recall.  Runs before each turn with a bounded
# timeout (fail-open).  Results are injected as untrusted context.
[memory.recall]
enabled = true
inject_into_context = true
max_items = 4
max_bytes = 65536
timeout_ms = 500

# Post-turn fact extraction.  Feeds into the background consolidation worker.
[memory.extraction]
enabled = true
mode = "local"               # "local" (regex-based) | "llm" (cheap-model)
max_facts_per_turn = 5

# Automatic promotion of high-confidence consolidated facts into CoreMemory
# learned blocks that appear in the agent's system prompt.
[memory.promotion]
enabled = true
min_confidence = 0.7
max_promoted_facts = 20

[governed_review]
enabled = true
model = "default"
max_input_bytes = 262144
max_output_bytes = 65536
max_tokens = 16384
max_tool_calls = 0
max_wall_time_seconds = 120
max_pending_jobs = 64
max_concurrent_jobs = 2

[daemon]
# Canonical socket dir is fabric::paths::SOCKET_DIR = /run/aletheon.
# Linux /var/run compatibility is supplied by the OS symlink.
socket_path = "/run/aletheon/aletheon.sock"
log_level = "info"


# User-mode paths retain backwards-compatible `~` expansion. Production must
# override with config/production.toml.example; secret values are never inline.
[deployment]
mode = "user"

[deployment.paths]
state_root = "~/.aletheon"
config_root = "~/.aletheon"
runtime_root = "/run/aletheon"
cache_root = "~/.cache/aletheon"
state = "~/.aletheon/state"
goals = "~/.aletheon/goals"
sessions = "~/.aletheon/sessions"
mnemosyne = "~/.aletheon/memory"
artifacts = "~/.aletheon/artifacts"
worktrees = "~/.aletheon/worktrees"
audit = "~/.aletheon/audit"
secret_root = "~/.config/aletheon"

[deployment.quotas]
total_data_bytes = 107374182400
total_data_soft_bytes = 91268055040
total_data_items = 2000000
minimum_free_bytes = 5368709120
artifacts_bytes = 21474836480
artifacts_soft_bytes = 17179869184
artifacts_items = 100000
worktrees_bytes = 42949672960
worktrees_soft_bytes = 34359738368
worktrees_items = 10000
audit_bytes = 5368709120
audit_soft_bytes = 4294967296
audit_items = 400000
sessions_bytes = 10737418240
sessions_soft_bytes = 8589934592
sessions_items = 500000
google_bytes = 5368709120
google_soft_bytes = 4294967296
google_items = 500000
gbrain_spool_bytes = 268435456
gbrain_spool_soft_bytes = 201326592
gbrain_spool_items = 10000

[deployment.integrations]
telegram = false
google = false
gbrain = false

[deployment.secrets]
# provider = "/etc/aletheon/credentials/provider.env"
# telegram = "/etc/aletheon/credentials/telegram.env"
# google_vault_key = "/etc/aletheon/credentials/google-vault.key"
# gbrain = "/etc/aletheon/credentials/gbrain.env"
# backup_password = "/etc/aletheon/credentials/restic-password"

[deployment.backup]
mode = "disabled"
# repository_file = "/etc/aletheon/credentials/restic-repository"

[deployment.health]
minimum_free_bytes = 5368709120
maximum_backup_age_secs = 129600
maximum_sync_lag_secs = 3600

# Optional external adapters are disabled by default. Their credentials are
# references to host-owned environment variables, never inline secret values.
[integrations.google]
client_type = "public"

[integrations.search]
enabled = false
