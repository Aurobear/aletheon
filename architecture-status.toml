[[turn_entry]]
name = "RuntimeAgentSupervisor"
role = "child agent 生命周期权威"
production_caller = "Aletheon daemon bootstrap"
evidence = "crates/aletheon/src/wiring/daemon/bootstrap/services.rs:475"
status = "production"

# 已接受的稳定边界，不是待删除依赖。
[[reviewed_dependency]]
from = "corpus"
to = "platform"
reason = "工具执行通过统一 platform contract 访问宿主能力"
classification = "stable"

[[reviewed_dependency]]
from = "execd"
to = "platform"
reason = "隔离执行守护进程通过 Platform structured patch 与 operation-scoped filesystem contract 执行补丁"
classification = "stable"

[[reviewed_dependency]]
from = "aletheon"
to = "runtime"
reason = "Runtime 拥有 Agent/Session/Turn 生命周期；Aletheon 只组装 host effect、durable adapter 与窄 facade"
